name: live-screenshot (temporary)
on:
  push:
    branches: [claude/live-screenshot-tmp]
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null && node node_modules/playwright/cli.js install --with-deps chromium
      - run: node live-shots/shoot.cjs
      - run: |
          git config user.name "live-screenshot"
          git config user.email "noreply@github.com"
          git add live-shots
          git commit -m "Live screenshots" && git push
