name: CI
# Two speeds (2026-10-09 simpler delivery): `checks` runs on every push; `quality` (database,
# build, browser tests) waits until a pull request is out of draft. Documentation-only pull
# requests run nothing; main is always checked in full.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run ka:scan
      - run: npm run test

  quality:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # A hung step otherwise holds the job for GitHub's 6-hour default (lib/ci-workflow.test.ts).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10
        if: hashFiles('playwright.config.ts') != ''
      # Throwaway database (spec 2026-10-08 simpler dev structure 4.1): every run gets its own
      # local Supabase stack with all migrations, seeded after the unit tests, discarded with
      # the runner.
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with: { version: 2.109.1 }
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta
        timeout-minutes: 10
      - name: Point build and e2e at the throwaway stack
        run: |
          set -o pipefail
          SETTINGS='^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY)='
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E "$SETTINGS" \
            | sed 's/"//g' >> "$GITHUB_ENV"
          # all three or stop here: a missing anon key would otherwise surface as confusing e2e errors
          test "$(grep -cE "$SETTINGS" "$GITHUB_ENV")" -eq 3
      - run: node scripts/seed-staging.mjs --confirm-ref local
        env:
          NEXT_PUBLIC_APP_ENV: preview
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: preview
          PHONE_VERIFICATION_PROVIDER: test
          NEXT_PUBLIC_AUTH_MODE: google
      - name: Derive per-run e2e test phone
        if: hashFiles('playwright.config.ts') != ''
        run: |
          # 55-block: disjoint from the canonical seed's 50XXXXXXX phones (spec §7).
          # Digit 8 folds in the retry attempt; digit 9 (=9) is the login journey's slot;
          # funnel journeys replace that final digit (see e2e/funnel-helpers.ts).
          echo "E2E_TEST_PHONE=55$(printf '%05d' $(( ${{ github.run_number }} % 100000 )))$(( ${{ github.run_attempt }} % 10 ))9" >> "$GITHUB_ENV"
      # e2e asserts exact facts about the canonical seed (12 approved delegates, leaderboard
      # order). Every run seeds a fresh throwaway stack, so a mismatch is a real defect, not drift.
      - run: npm run e2e
        if: hashFiles('playwright.config.ts') != ''
        env:
          NEXT_PUBLIC_APP_ENV: preview
          PHONE_VERIFICATION_PROVIDER: test
          NEXT_PUBLIC_AUTH_MODE: google
          CI: "true"
